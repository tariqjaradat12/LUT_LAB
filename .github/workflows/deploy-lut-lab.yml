name: Deploy Lut Lab

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-lut-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build for tariqjaradat12.github.io (site root)
        working-directory: web
        env:
          VITE_BASE: /
          VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          cp -r dist ../dist-root

      - name: Build legacy mirror for /LUT_LAB/
        working-directory: web
        env:
          VITE_BASE: /LUT_LAB/
          VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish to tariqjaradat12.github.io
        if: ${{ vars.ENABLE_USER_PAGES == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: tariqjaradat12/tariqjaradat12.github.io
          publish_branch: gh-pages
          publish_dir: ./dist-root
          commit_message: 'Deploy Lut Lab to user site'

      - name: Publish legacy mirror to LUT_LAB gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          commit_message: 'Deploy Lut Lab legacy mirror'
